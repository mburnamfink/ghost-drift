<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghost Drift: Craft Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05070d;
        color: #d8f6ff;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      }
      canvas {
        display: block;
      }
      .craft-label {
        font-size: 12px;
        letter-spacing: 0.2em;
        opacity: 0.75;
        pointer-events: none;
      }
      #readout {
        position: fixed;
        left: 16px;
        bottom: 16px;
        font-size: 12px;
        line-height: 1.6;
        opacity: 0.8;
        white-space: pre;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="readout"></div>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
